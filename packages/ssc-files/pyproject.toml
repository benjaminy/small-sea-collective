[project]
name = "ssc-files"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cod-sync",
    "click>=8.0",
    "fastapi[standard]>=0.118.0",
    "jinja2>=3.1",
    "small-sea-client",
]

[project.optional-dependencies]
test = [
    "boto3>=1.40.53",
    "pytest>=8.4.2",
    "small-sea-hub",
    "small-sea-manager",
]

[project.scripts]
ssc-files = "ssc_files.cli:cli"

[tool.uv.sources]
cod-sync = { workspace = true }
small-sea-client = { workspace = true }
small-sea-hub = { workspace = true }
small-sea-manager = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
