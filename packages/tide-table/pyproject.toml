[project]
name = "tide-table"
version = "0.1.0"
requires-python = ">=3.12"
description = "Concept-stage Small Sea app for team-owned calendar and scheduling."
readme = "README.md"
dependencies = ["cod-sync", "small-sea-client", "starlette>=0.48.0", "uvicorn>=0.37.0"]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
    "small-sea-hub",
    "small-sea-manager",
]

[tool.uv.sources]
cod-sync = { workspace = true }
small-sea-client = { workspace = true }
small-sea-hub = { workspace = true }
small-sea-manager = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
